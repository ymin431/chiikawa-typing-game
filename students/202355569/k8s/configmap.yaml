apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "typing-garden-app"
data:
  server.py: |
    """Chiikawa typing garden: dependency-free, single-Pod acid-rain typing game service."""
    import gzip, json, os, random, re, secrets, sqlite3, time, unicodedata
    from pathlib import Path
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
    from urllib.parse import urlparse, parse_qs

    ROOT = Path(__file__).resolve().parent
    DATA = Path(os.environ.get('DATA_DIR', '/tmp/typing-garden-data'))
    DATA.mkdir(parents=True, exist_ok=True)
    DB = DATA / 'garden.db'
    DURATION = int(os.environ.get('GAME_DURATION', '60'))
    LIVES = int(os.environ.get('GAME_LIVES', '5'))
    RULES = {'easy': {'interval':3.4,'fall':14,'factor':1}, 'normal':{'interval':2.6,'fall':11,'factor':1.3}, 'hard':{'interval':1.8,'fall':8,'factor':1.6}}
    WORDS = {
     'ko': '구름 하늘 바람 잔디 소풍 우유 딸기 복숭아 고양이 토끼 햇살 별빛 달빛 꽃잎 이슬 나무 숲속 바다 파도 여름 봄날 가을 겨울 마음 친구 행복 웃음 선물 산책 노을 무지개 솜사탕 도토리 조약돌 반짝임 민들레 해바라기 물방울 사탕 리본 쿠키 푸딩 마카롱 초콜릿 치이카와 하치와레 우사기 모몽가 랏코 밤하늘 별사탕 다정함 포근함 용기 응원 약속 추억 멜로디 작은꿈 초록빛 나비 튤립 새싹 꽃밭 오솔길 바구니 도시락 딸기우유 크루아상 고구마 감자 요정 소원 기적 오렌지 레몬 민트 피크닉 구름빵 눈송이 은하수 아침 햇볕 고요함 두근두근 사뿐사뿐 몽글몽글 반짝반짝 데굴데굴'.split(),
     'en': 'cloud sky breeze grass picnic milk berry peach kitten rabbit sunshine star moon flower dew tree forest ocean wave summer spring autumn winter heart friend happy smile gift walk sunset rainbow cotton acorn pebble sparkle dandelion sunflower raindrop candy ribbon cookie pudding chocolate dream courage cheer promise memory melody butterfly garden basket lemon mint morning snowflake cozy little gentle blossom wonder'.split()
    }

    # path -> (file in /app, content type, cacheable). three.js is stored pre-gzipped to keep the ConfigMap small.
    STATIC = {'/':('index.html','text/html; charset=utf-8',False),'/style.css':('style.css','text/css; charset=utf-8',False),'/app.js':('app.js','text/javascript; charset=utf-8',False),
     '/favicon.svg':('favicon.svg','image/svg+xml',True),'/three.module.min.js':('three.module.min.js.gz','text/javascript; charset=utf-8',True),
     '/meadow.webp':('meadow.webp','image/webp',True),'/keyboard.mp3':('keyboard.mp3','audio/mpeg',True)}
    # Character images are discovered by name: fall-<character>-<n>.<ext> drop from the sky, profile-<character>.<ext> are avatars.
    AVATARS = ('chiikawa','hachiware','usagi','rakko','momonga','kurimanju','shisa','kani')
    IMAGE = re.compile(r'^(fall|profile)-([a-z]+)(?:-(\d+))?\.(png|webp|jpg|jpeg|gif)$')
    IMAGE_TYPES = {'png':'image/png','webp':'image/webp','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif'}

    def character_assets():
     fall={a:[] for a in AVATARS}; profiles={}
     for f in sorted(ROOT.iterdir()):
      m=IMAGE.match(f.name)
      if not m or m.group(2) not in AVATARS: continue
      if m.group(1)=='fall': fall[m.group(2)].append('/'+f.name)
      else: profiles[m.group(2)]='/'+f.name
     return {'fall':{k:v for k,v in fall.items() if v},'profiles':profiles,'names':list(AVATARS)}

    def connect():
     c=sqlite3.connect(DB, timeout=10); c.row_factory=sqlite3.Row; c.execute('PRAGMA busy_timeout=10000'); return c

    def init_db():
     with connect() as c:
      c.executescript('''CREATE TABLE IF NOT EXISTS sessions (id TEXT PRIMARY KEY, created REAL, paused_at REAL, paused REAL NOT NULL DEFAULT 0, config TEXT NOT NULL, summary TEXT);
    CREATE TABLE IF NOT EXISTS scores (id INTEGER PRIMARY KEY, session TEXT UNIQUE NOT NULL, nickname TEXT NOT NULL, difficulty TEXT NOT NULL, language TEXT NOT NULL, mode TEXT NOT NULL, score INTEGER NOT NULL, accuracy REAL NOT NULL, cpm REAL NOT NULL, combo INTEGER NOT NULL, created TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%SZ','now')));
    CREATE INDEX IF NOT EXISTS score_sort ON scores(mode,difficulty,language,score DESC);
    CREATE TABLE IF NOT EXISTS guestbook (id INTEGER PRIMARY KEY, nickname TEXT NOT NULL, message TEXT NOT NULL, avatar TEXT NOT NULL, created TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%SZ','now')));
    ''')
      # Columns added after the first release; existing databases on the PVC are migrated in place.
      for table,column in (('scores','avatar'),('guestbook','session')):
       if column not in [r['name'] for r in c.execute(f'PRAGMA table_info({table})')]: c.execute(f'ALTER TABLE {table} ADD COLUMN {column} TEXT')

    def clean(value, maximum, name, minimum=1):
     if not isinstance(value,str): raise ValueError(name+'을 확인해 주세요.')
     value=unicodedata.normalize('NFC',value).strip()
     if not minimum<=len(value)<=maximum or any(ord(ch)<32 for ch in value): raise ValueError(f'{name}은 {minimum}~{maximum}자로 입력해 주세요.')
     return value

    def distance(a,b):
     row=list(range(len(b)+1))
     for i,x in enumerate(a,1):
      nxt=[i]
      for j,y in enumerate(b,1): nxt.append(min(nxt[-1]+1,row[j]+1,row[j-1]+(x!=y)))
      row=nxt
     return row[-1]

    def summarize(config, attempts, elapsed):
     if not isinstance(attempts,list) or len(attempts)>600: raise ValueError('입력 기록이 너무 많습니다.')
     deck=config['deck']; mode=config['mode']; rule=RULES[config['difficulty']]
     used=set(); attempted=set(); good=total=score=combo=best=0; misses=[]; wrong=[]; previous=-1; next_id=0; actual=elapsed; hits=[]; ticks=[0]*12
     def expire(t):
      nonlocal combo, actual
      if mode!='rain': return False
      for item in deck:
       if item['id'] not in used and item['at']+rule['fall']<=t:
        used.add(item['id']); misses.append(item['text']); combo=0
        if len(misses)>=LIVES:
         actual=item['at']+rule['fall']; return True
      return False
     for a in attempts:
      if not isinstance(a,dict): raise ValueError('입력 기록 형식이 잘못됐어요.')
      at=a.get('at'); idx=a.get('id'); value=a.get('value')
      if isinstance(at,bool) or not isinstance(at,(int,float)) or not 0<=at<=elapsed+.15 or at<previous: raise ValueError('플레이 시간과 입력 기록이 맞지 않아요.')
      previous=at
      if expire(at): break
      if isinstance(idx,bool) or not isinstance(idx,int) or not 0<=idx<len(deck): raise ValueError('단어 기록이 맞지 않아요.')
      item=deck[idx]
      if idx in used or (mode=='rain' and at<item['at']) or (mode!='rain' and idx!=next_id): raise ValueError('아직 입력할 수 없는 단어예요.')
      value=clean(value,160,'입력')
      target=item['text']; span=max(len(target),len(value)); good+=max(0,span-distance(target,value)); total+=span; attempted.add(idx)
      if value==target:
       combo+=1; best=max(best,combo); score+=round(len(target)*10*rule['factor'])+min(combo,20)*5
       used.add(idx); hits.append(target); ticks[min(11,int(at//5))]+=len(target)
       if mode!='rain': next_id+=1
      else:
       combo=0
       if target not in wrong: wrong.append(target)
     expire(elapsed)
     correct_chars=sum(map(len,hits)); actual=max(.1,actual)
     return {'score':score,'accuracy':round(100*good/total,1) if total else 0,'cpm':round(correct_chars/(actual/60)), 'combo':best,'hits':len(hits),'misses':len(misses),'wrong':list(dict.fromkeys(wrong+misses)), 'elapsed':round(actual,1),'timeline':ticks,'mode':mode,'difficulty':config['difficulty'],'language':config['language'],'attempts':len(attempts),'correct_chars':correct_chars}

    class Handler(BaseHTTPRequestHandler):
     server_version='TypingGarden/1.0'
     def log_message(self, fmt, *args):
      # Never log query strings, request bodies or credentials.
      print(f'{self.command} {urlparse(self.path).path} {args[1] if len(args)>1 else ""}',flush=True)
     def send(self,status,data,typ='application/json; charset=utf-8',headers=None):
      raw=json.dumps(data,ensure_ascii=False).encode() if isinstance(data,(dict,list)) else data
      self.send_response(status); self.send_header('Content-Type',typ); self.send_header('Content-Length',str(len(raw)))
      for k,v in (headers or {'Cache-Control':'no-store'}).items(): self.send_header(k,v)
      self.send_header('X-Content-Type-Options','nosniff'); self.send_header('Referrer-Policy','same-origin'); self.send_header('X-Frame-Options','DENY')
      self.send_header('Content-Security-Policy',"default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'")
      self.end_headers()
      if self.command!='HEAD': self.wfile.write(raw)
     def do_HEAD(self): self.do_GET()
     def do_GET(self):
      p=urlparse(self.path); q=parse_qs(p.query)
      try:
       if p.path=='/api/health': return self.send(200,{'ok':True})
       if p.path=='/api/ready':
        with connect() as c: c.execute('SELECT 1 FROM sessions LIMIT 1').fetchone()
        return self.send(200,{'ready':True})
       if p.path=='/api/leaderboard':
        difficulty=q.get('difficulty',['normal'])[0]; language=q.get('language',['ko'])[0]; mode=q.get('mode',['rain'])[0]
        with connect() as c: rows=c.execute('SELECT nickname,avatar,score,accuracy,cpm,combo,created FROM scores WHERE difficulty=? AND language=? AND mode=? ORDER BY score DESC, accuracy DESC, created ASC LIMIT 30',(difficulty,language,mode)).fetchall()
        return self.send(200,{'items':[dict(r) for r in rows]})
       if p.path=='/api/guestbook':
        with connect() as c: rows=c.execute('SELECT nickname,message,avatar,created FROM guestbook ORDER BY id DESC LIMIT 60').fetchall()
        return self.send(200,{'items':[dict(r) for r in rows]})
       if p.path=='/api/assets': return self.send(200,character_assets())
       if p.path=='/api/stats':
        with connect() as c:
         runs=c.execute('SELECT COUNT(*) FROM sessions WHERE summary IS NOT NULL').fetchone()[0]
        return self.send(200,{'games':runs})
       m=IMAGE.match(p.path[1:])
       if m and (ROOT/p.path[1:]).is_file(): return self.send(200,(ROOT/p.path[1:]).read_bytes(),IMAGE_TYPES[m.group(4)],{'Cache-Control':'public, max-age=3600'})
       if p.path not in STATIC or not (ROOT/STATIC[p.path][0]).is_file(): return self.send(404,{'error':'페이지를 찾을 수 없어요.'})
       fn,typ,cache=STATIC[p.path]; raw=(ROOT/fn).read_bytes(); headers={'Cache-Control':'public, max-age=86400' if cache else 'no-store'}
       if fn.endswith('.gz'):
        headers['Vary']='Accept-Encoding'
        if 'gzip' in self.headers.get('Accept-Encoding',''): headers['Content-Encoding']='gzip'
        else: raw=gzip.decompress(raw)
       self.send(200,raw,typ,headers)
      except (sqlite3.Error,OSError): self.send(503,{'error':'저장소를 준비 중이에요. 잠시 후 다시 시도해 주세요.'})
     def do_POST(self):
      try:
       origin=self.headers.get('Origin')
       if origin and urlparse(origin).netloc!=self.headers.get('Host'): return self.send(403,{'error':'다른 사이트에서는 요청할 수 없어요.'})
       length=int(self.headers.get('Content-Length','0'))
       if length<=0 or length>65536: return self.send(413,{'error':'요청 크기를 확인해 주세요.'})
       if 'application/json' not in self.headers.get('Content-Type',''): return self.send(415,{'error':'JSON 요청이 필요해요.'})
       data=json.loads(self.rfile.read(length))
       if not isinstance(data,dict): raise ValueError('요청 형식이 잘못됐어요.')
       p=urlparse(self.path).path; now=time.time()
       with connect() as c:
        c.execute('BEGIN IMMEDIATE')
        if p=='/api/start':
         mode=data.get('mode','rain'); difficulty=data.get('difficulty','normal'); lang=data.get('language','ko')
         if mode!='rain' or difficulty not in RULES or lang not in WORDS: raise ValueError('게임 설정을 확인해 주세요.')
         source=[w for w in WORDS[lang] if len(w)<=({'easy':4,'normal':6,'hard':12}[difficulty] if lang=='ko' else {'easy':6,'normal':9,'hard':15}[difficulty])]
         shuffled=[]
         while len(shuffled)<160:
          batch=source[:]; random.SystemRandom().shuffle(batch); shuffled.extend(batch)
         deck=[{'id':i,'text':w,'at':round(.5+i*RULES[difficulty]['interval'],2),'lane':(i*3+random.randrange(3))%7,'character':i%3} for i,w in enumerate(shuffled[:160])]
         config={'mode':mode,'difficulty':difficulty,'language':lang,'duration':DURATION,'lives':LIVES,'rule':RULES[difficulty],'deck':deck}; sid=secrets.token_urlsafe(24)
         c.execute('DELETE FROM sessions WHERE created < ? AND summary IS NULL',(now-86400,))
         c.execute('INSERT INTO sessions(id,created,config) VALUES(?,?,?)',(sid,now,json.dumps(config,ensure_ascii=False)))
         return self.send(201,{'session':sid,**config})
        if p in ('/api/pause','/api/resume','/api/finish','/api/register'):
         sid=data.get('session')
         if not isinstance(sid,str) or len(sid)>100: raise ValueError('게임을 먼저 시작해 주세요.')
         row=c.execute('SELECT * FROM sessions WHERE id=?',(sid,)).fetchone()
         if row is None: raise ValueError('게임이 만료됐어요. 다시 시작해 주세요.')
         config=json.loads(row['config'])
         if p=='/api/register':
          # One form after a game: the score goes to the ranking (if anything was caught) and an optional note to the guestbook.
          if row['summary'] is None: raise ValueError('게임을 먼저 완료해 주세요.')
          nickname=clean(data.get('nickname'),12,'닉네임'); summary=json.loads(row['summary']); avatar=data.get('avatar')
          if avatar not in AVATARS: raise ValueError('프로필 캐릭터를 골라 주세요.')
          message=data.get('message') or ''
          if message: message=clean(message,140,'방명록')
          if c.execute('SELECT 1 FROM scores WHERE session=?',(sid,)).fetchone() or c.execute('SELECT 1 FROM guestbook WHERE session=?',(sid,)).fetchone(): raise ValueError('이미 등록한 기록이에요.')
          if summary['hits']==0 and not message: raise ValueError('잡은 친구가 없으면 방명록만 남길 수 있어요.')
          if summary['hits']>0: c.execute('INSERT INTO scores(session,nickname,avatar,difficulty,language,mode,score,accuracy,cpm,combo) VALUES(?,?,?,?,?,?,?,?,?,?)',(sid,nickname,avatar,config['difficulty'],config['language'],config['mode'],summary['score'],summary['accuracy'],summary['cpm'],summary['combo']))
          if message: c.execute('INSERT INTO guestbook(nickname,message,avatar,session) VALUES(?,?,?,?)',(nickname,message,avatar,sid))
          return self.send(201,{'ranked':summary['hits']>0,'note':bool(message)})
         if row['summary'] is not None:
          if p=='/api/finish': return self.send(200,json.loads(row['summary']))
          raise ValueError('이미 끝난 게임이에요.')
         if now-row['created']>7200: raise ValueError('게임이 만료됐어요. 다시 시작해 주세요.')
         elapsed=(row['paused_at'] or now)-row['created']-row['paused']
         if p=='/api/pause':
          if row['paused_at'] is None: c.execute('UPDATE sessions SET paused_at=? WHERE id=?',(now,sid))
          return self.send(200,{'ok':True})
         if p=='/api/resume':
          if row['paused_at'] is not None: c.execute('UPDATE sessions SET paused=paused+?,paused_at=NULL WHERE id=?',(now-row['paused_at'],sid))
          return self.send(200,{'ok':True})
         client_elapsed=data.get('elapsed')
         if isinstance(client_elapsed,bool) or not isinstance(client_elapsed,(int,float)) or not .1<=client_elapsed<=DURATION+.5 or client_elapsed>elapsed+1.5: raise ValueError('게임 시간을 확인할 수 없어요.')
         result=summarize(config,data.get('attempts',[]),min(DURATION,client_elapsed)); c.execute('UPDATE sessions SET summary=? WHERE id=?',(json.dumps(result,ensure_ascii=False),sid)); return self.send(200,result)
        return self.send(404,{'error':'요청을 찾을 수 없어요.'})
      except (ValueError,TypeError,KeyError,OverflowError): self.send(400,{'error':str(__import__('sys').exc_info()[1]) or '입력을 확인해 주세요.'})
      except sqlite3.Error: self.send(503,{'error':'기록을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.'})
      except (BrokenPipeError,ConnectionResetError): pass

    if __name__=='__main__':
     init_db(); port=int(os.environ.get('PORT','8080')); host=os.environ.get('BIND_HOST','0.0.0.0')
     server=ThreadingHTTPServer((host,port),Handler); server.daemon_threads=True
     print(f'Typing garden listening on http://{host}:{port}',flush=True); server.serve_forever()
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#bfe6f6"><meta name="description" content="TYPEFALL — 하늘에서 내려오는 먼작귀들을 타자로 잡는 3D 산성비 타자 게임.">
    <title>TYPEFALL — 먼작귀 타이핑</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
    </head>
    <body class="loading">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
     <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></symbol>
     <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
     <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
     <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></symbol>
     <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
     <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </svg>

    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-label="떨어지는 단어"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <aside class="side" id="side" aria-label="랭킹과 방명록">
     <div class="wordmark"><b>TYPEFALL</b><span>먼작귀 타이핑</span></div>
     <div class="tabs" role="tablist">
      <button role="tab" id="tab-rank" aria-selected="true" data-tab="rank">랭킹</button>
      <button role="tab" id="tab-guest" aria-selected="false" data-tab="guest">방명록</button>
     </div>
     <section class="tab-panel" id="panel-rank" role="tabpanel" aria-labelledby="tab-rank">
      <div class="filters">
       <div class="chips" role="group" aria-label="랭킹 난이도"><button data-board-difficulty="easy">쉬움</button><button data-board-difficulty="normal">보통</button><button data-board-difficulty="hard">어려움</button></div>
       <div class="chips" role="group" aria-label="랭킹 언어"><button data-board-language="ko">KO</button><button data-board-language="en">EN</button></div>
      </div>
      <ol class="rows rank" id="board"></ol>
     </section>
     <section class="tab-panel" id="panel-guest" role="tabpanel" aria-labelledby="tab-guest" hidden>
      <ul class="rows notes" id="guestbook"></ul>
     </section>
     <button class="side-close" id="side-close" aria-label="닫기"><svg><use href="#i-close"/></svg></button>
    </aside>

    <div class="corner">
     <button class="icon" id="side-open" aria-label="랭킹·방명록 열기"><svg><use href="#i-board"/></svg></button>
     <button class="icon" id="sound-toggle" aria-label="소리 끄기" aria-pressed="true"><svg><use href="#i-sound"/></svg></button>
     <button class="icon" id="pause-button" aria-label="일시정지" hidden><svg><use href="#i-pause"/></svg></button>
    </div>

    <header class="hud" id="hud" hidden>
     <span class="hearts" id="hearts" aria-label="남은 하트"></span>
     <span class="hud-sep"></span>
     <span class="hud-score"><b id="score">0</b><small>PTS</small></span>
     <span class="hud-sep"></span>
     <span class="hud-time" id="clock">60</span>
    </header>
    <div class="combo" id="combo" aria-live="polite"></div>

    <section class="stagewrap" id="start-screen">
     <div class="hero">
      <p class="eyebrow">먼작귀 타이핑 · 60초 챌린지</p>
      <h1>TYPE<span>FALL</span></h1>
      <p class="lead">하늘에서 내려오는 친구들이 잔디에 닿기 전에<br>단어를 입력하고 Enter.</p>
      <div class="controls">
       <div class="seg" role="group" aria-label="난이도"><button data-difficulty="easy">쉬움</button><button data-difficulty="normal">보통</button><button data-difficulty="hard">어려움</button></div>
       <div class="seg" role="group" aria-label="언어"><button data-language="ko">한글</button><button data-language="en">English</button></div>
      </div>
      <button class="cta" id="start-button">게임 시작 <kbd>Enter</kbd></button>
     </div>
    </section>

    <section class="stagewrap" id="countdown" hidden><div class="count" id="count"></div></section>

    <section class="modal" id="pause-screen" hidden>
     <div class="sheet small">
      <p class="eyebrow">PAUSED</p>
      <h2 id="pause-title">잠시 멈춤</h2>
      <p class="lead" id="pause-text">준비되면 이어서 해요.</p>
      <button class="cta" id="resume-button">이어서 하기</button>
      <button class="ghost" id="quit-button">그만하고 결과 보기</button>
     </div>
    </section>

    <section class="modal" id="result-screen" hidden>
     <div class="sheet result" role="dialog" aria-labelledby="result-kicker">
      <div class="result-head">
       <p class="eyebrow" id="result-kicker">RESULT</p>
       <div class="big-score" id="result-score">0</div>
       <div class="stats">
        <div><b id="result-hits">0</b><span>잡은 친구</span></div>
        <div><b id="result-accuracy">0%</b><span>정확도</span></div>
        <div><b id="result-cpm">0</b><span>타/분</span></div>
        <div><b id="result-combo">0</b><span>최대 콤보</span></div>
       </div>
      </div>
      <form class="register" id="register-form" autocomplete="off">
       <p class="field-label">프로필 캐릭터</p>
       <div class="avatars" id="avatar-picker" role="radiogroup" aria-label="프로필 캐릭터"></div>
       <div class="fields">
        <input id="reg-name" maxlength="12" required placeholder="닉네임" aria-label="닉네임">
        <textarea id="reg-message" maxlength="140" rows="2" placeholder="방명록에 한마디 (선택)" aria-label="방명록"></textarea>
       </div>
       <div class="register-foot">
        <span class="note" id="register-note" role="status"></span>
        <button type="submit" class="cta slim" id="register-button">랭킹 · 방명록 등록</button>
       </div>
      </form>
      <div class="result-actions">
       <button class="ghost" id="home-button">처음으로</button>
       <button class="cta slim" id="retry-button">다시 하기</button>
      </div>
     </div>
    </section>

    <form class="typing" id="typing-form" autocomplete="off" hidden>
     <input id="typing-input" aria-label="단어 입력" placeholder="단어 입력 후 Enter" maxlength="40" autocapitalize="off" spellcheck="false" disabled>
     <kbd>↵</kbd>
    </form>
    <p class="feedback" id="feedback" role="status"></p>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript><p class="noscript">JavaScript를 켜면 게임을 할 수 있어요.</p></noscript>
    </body>
    </html>
  style.css: |
    :root {
      --ink: #15211b;
      --ink-2: #4a5a51;
      --ink-3: #8a978f;
      --line: rgba(21, 33, 27, .09);
      --accent: #1f8a5b;
      --danger: #e5484d;
      --glass: rgba(255, 255, 255, .58);
      --glass-strong: rgba(255, 255, 255, .8);
      --glass-line: rgba(255, 255, 255, .78);
      --blur: blur(22px) saturate(1.6);
      --shadow: 0 24px 60px -24px rgba(25, 60, 45, .45), 0 2px 6px rgba(25, 60, 45, .06);
      --side-w: 340px;
      --sans: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      --display: "Outfit", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #cfe8c0 url("/meadow.webp") center / cover no-repeat;
      color: var(--ink); font: 15px/1.5 var(--sans); letter-spacing: -.01em;
      -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: default; opacity: .45; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    [hidden] { display: none !important; }
    kbd { font: 500 11px var(--display); letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; border: 1px solid currentColor; opacity: .55; }
    .eyebrow { margin: 0; font: 500 12px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }

    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 1.2s ease; }
    body.loading #stage { opacity: 0; }

    /* ---------- glass surfaces ---------- */
    .side, .hud, .icon, .sheet, .typing, .hero {
      background: var(--glass); border: 1px solid var(--glass-line);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow);
    }

    /* ---------- left panel: ranking & guestbook ---------- */
    .side {
      position: fixed; z-index: 4; top: 16px; bottom: 16px; left: 16px; width: var(--side-w);
      display: flex; flex-direction: column; padding: 22px 18px 14px; border-radius: 24px;
      transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .4s;
    }
    body.playing .side { transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none; }
    .wordmark { display: flex; align-items: baseline; gap: 10px; padding: 0 6px 18px; }
    .wordmark b { font: 700 22px var(--display); letter-spacing: .14em; }
    .wordmark span { font-size: 12px; color: var(--ink-2); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: rgba(21, 33, 27, .06); }
    .tabs button { padding: 8px; border-radius: 10px; font-weight: 500; color: var(--ink-2); transition: background .2s, color .2s; }
    .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
    .tab-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .filters { display: flex; justify-content: space-between; gap: 8px; padding: 14px 2px 8px; }
    .chips { display: flex; gap: 2px; }
    .chips button { padding: 4px 10px; border-radius: 999px; font: 500 12px var(--display); color: var(--ink-3); }
    .chips button.on { background: var(--ink); color: #fff; }
    .rows { list-style: none; margin: 0; padding: 4px 0 0; overflow-y: auto; flex: 1; scrollbar-width: thin; }
    .rows li { display: grid; grid-template-columns: 26px 34px 1fr auto; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 12px; }
    .rows li + li { border-top: 1px solid var(--line); }
    .rows li.me { background: rgba(31, 138, 91, .1); border-color: transparent; }
    .rank li .n { font: 600 14px var(--display); color: var(--ink-3); text-align: center; }
    .rank li:nth-child(-n+3) .n { color: var(--ink); }
    .rows .who { min-width: 0; }
    .rows .who b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rows .who small { font: 400 11px var(--display); color: var(--ink-3); }
    .rank .pts { font: 600 16px var(--display); font-variant-numeric: tabular-nums; }
    .notes li { grid-template-columns: 34px 1fr; align-items: start; }
    .notes p { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; user-select: text; }
    .rows .empty { display: block; padding: 28px 8px; text-align: center; color: var(--ink-3); border: 0; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #fff; border: 1px solid var(--line); }
    .side-close { display: none; position: absolute; top: 18px; right: 16px; width: 32px; height: 32px; border-radius: 50%; }
    .side-close svg, .icon svg { width: 20px; height: 20px; }

    /* ---------- corner buttons ---------- */
    .corner { position: fixed; z-index: 5; top: max(16px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 8px; }
    .icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); transition: transform .15s, background .2s; fill: currentColor; }
    .icon:hover { transform: translateY(-1px); background: var(--glass-strong); }
    #side-open { display: none; }

    /* ---------- start ---------- */
    .stagewrap {
      position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
      padding: 16px 16px 16px calc(var(--side-w) + 32px); pointer-events: none;
    }
    .stagewrap > * { pointer-events: auto; }
    .hero { width: min(460px, 100%); padding: 36px 36px 30px; border-radius: 28px; animation: rise .8s cubic-bezier(.2, .8, .2, 1); }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    h1 { margin: 10px 0 10px; font: 700 clamp(48px, 8vw, 76px)/.95 var(--display); letter-spacing: .02em; }
    h1 span { font-weight: 300; }
    h2 { margin: 6px 0 4px; font: 600 26px var(--display); }
    .lead { margin: 0 0 26px; color: var(--ink-2); line-height: 1.65; }
    .controls { display: grid; gap: 8px; margin-bottom: 18px; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 14px; background: rgba(21, 33, 27, .06); }
    .seg button { padding: 10px 6px; border-radius: 10px; font-weight: 500; color: var(--ink-2); transition: background .2s, color .2s; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px 20px; border-radius: 16px;
      background: var(--ink); color: #fff; font: 600 16px var(--sans); letter-spacing: 0;
      box-shadow: 0 12px 28px -12px rgba(21, 33, 27, .7); transition: transform .15s, box-shadow .2s, background .2s;
    }
    .cta:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 16px 32px -12px rgba(21, 33, 27, .75); }
    .cta:active:not(:disabled) { transform: translateY(1px); }
    .cta kbd { opacity: .5; }
    .cta.slim { width: auto; padding: 12px 20px; font-size: 15px; }
    .ghost { padding: 12px 16px; border-radius: 14px; font-weight: 500; color: var(--ink-2); transition: background .2s, color .2s; }
    .ghost:hover { background: rgba(21, 33, 27, .06); color: var(--ink); }

    .count { font: 200 clamp(110px, 18vw, 180px)/1 var(--display); color: #fff; text-shadow: 0 10px 40px rgba(20, 60, 40, .35); animation: count .7s cubic-bezier(.2, .8, .2, 1); }
    .count.go { font-weight: 600; font-size: clamp(64px, 10vw, 110px); letter-spacing: .1em; }
    @keyframes count { from { opacity: 0; transform: scale(1.4); filter: blur(8px); } }

    /* ---------- in-game HUD ---------- */
    .hud {
      position: fixed; z-index: 5; top: max(16px, env(safe-area-inset-top)); left: 50%; translate: -50% 0;
      display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 8px 0 20px; border-radius: 18px;
    }
    .hud-sep { width: 1px; height: 20px; background: var(--line); }
    .hearts { display: flex; gap: 4px; }
    .hearts svg { width: 16px; height: 16px; fill: var(--danger); transition: fill .3s, transform .3s; }
    .hearts svg.empty { fill: rgba(21, 33, 27, .14); }
    .hearts svg.lost { animation: lost .5s ease; }
    @keyframes lost { 40% { transform: scale(1.5); } }
    .hud-score { min-width: 86px; text-align: right; }
    .hud-score b { font: 600 24px var(--display); font-variant-numeric: tabular-nums; }
    .hud-score small { margin-left: 5px; font: 500 10px var(--display); letter-spacing: .14em; color: var(--ink-3); }
    .hud-time {
      --ring: var(--ink); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
      font: 600 14px var(--display); font-variant-numeric: tabular-nums; color: #fff;
      background: radial-gradient(closest-side, var(--ring) 80%, transparent 83%), conic-gradient(var(--ring) var(--p, 100%), rgba(21, 33, 27, .12) 0);
    }
    .hud-time.hurry { --ring: var(--danger); }
    .combo {
      position: fixed; z-index: 4; top: 84px; left: 50%; translate: -50% 0; pointer-events: none; opacity: 0;
      font: 600 15px var(--display); letter-spacing: .24em; color: #fff; text-shadow: 0 2px 12px rgba(20, 60, 40, .45);
    }
    .combo b { font-size: 30px; letter-spacing: .02em; margin-right: 8px; }
    .combo.show { animation: combo 1s ease forwards; }
    @keyframes combo { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

    /* ---------- falling word labels ---------- */
    .labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    .label {
      position: absolute; left: 0; top: 0; white-space: nowrap; padding: 5px 12px 6px; border-radius: 10px;
      font: 500 18px/1.15 var(--sans); color: var(--ink); background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 8px 20px -10px rgba(20, 50, 35, .5);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      will-change: transform; transition: background .15s, color .15s, opacity .25s;
    }
    .label .typed { color: var(--accent); }
    .label.target { background: var(--ink); color: #fff; border-color: var(--ink); }
    .label.target .typed { color: #7ee2ae; }
    .label.danger { color: var(--danger); }
    .label.target.danger { color: #ffb3b5; }
    .label.gone { opacity: 0; }

    .pop { position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none; font: 600 22px var(--display); color: #fff; text-shadow: 0 2px 14px rgba(20, 60, 40, .5); animation: pop .9s cubic-bezier(.2, .8, .2, 1) forwards; }
    .pop.miss { font-size: 15px; font-weight: 500; letter-spacing: .1em; }
    @keyframes pop { from { opacity: 0; translate: -50% 0; } 20% { opacity: 1; } to { opacity: 0; translate: -50% -90px; } }
    .flash { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px rgba(229, 72, 77, .45); transition: opacity .6s; }
    .flash.on { opacity: 1; transition: none; }

    /* ---------- typing input ---------- */
    .typing {
      position: fixed; z-index: 5; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); translate: -50% 0;
      width: min(460px, calc(100% - 32px)); display: flex; align-items: center; padding: 0 16px 0 22px; border-radius: 18px;
      background: var(--glass-strong); transition: box-shadow .2s;
    }
    .typing:focus-within { box-shadow: 0 0 0 4px rgba(255, 255, 255, .55), var(--shadow); }
    .typing input { flex: 1; min-width: 0; height: 60px; border: 0; background: none; outline: none; font: 500 22px var(--sans); color: var(--ink); text-align: center; user-select: text; }
    .typing input::placeholder { color: var(--ink-3); font-size: 16px; font-weight: 400; }
    .typing kbd { transition: color .2s, opacity .2s; }
    .typing.right kbd { color: var(--accent); opacity: 1; }
    .typing.wrong { animation: shake .3s; }
    @keyframes shake { 25% { translate: calc(-50% - 7px) 0; } 50% { translate: calc(-50% + 6px) 0; } 75% { translate: calc(-50% - 3px) 0; } }
    .feedback { position: fixed; z-index: 5; left: 0; right: 0; bottom: max(98px, calc(env(safe-area-inset-bottom) + 72px)); margin: 0; text-align: center; font-size: 13px; color: var(--ink-2); pointer-events: none; }

    /* ---------- modal sheets ---------- */
    .modal { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(230, 242, 235, .35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { width: min(560px, 100%); padding: 30px; border-radius: 28px; background: var(--glass-strong); animation: rise .5s cubic-bezier(.2, .8, .2, 1); }
    .sheet.small { width: min(380px, 100%); text-align: center; }
    .sheet.small .cta { margin-top: 4px; }
    .sheet.small .ghost { margin-top: 6px; width: 100%; }
    .result-head { text-align: center; }
    .big-score { margin: 6px 0 18px; font: 300 76px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stats div { padding: 14px 4px; }
    .stats div + div { border-left: 1px solid var(--line); }
    .stats b { display: block; font: 600 22px var(--display); font-variant-numeric: tabular-nums; }
    .stats span { font-size: 12px; color: var(--ink-3); }
    .register { padding-top: 22px; }
    .field-label { margin: 0 0 10px; font: 500 12px var(--display); letter-spacing: .12em; color: var(--ink-2); }
    .avatars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 14px; }
    .avatars button { position: relative; aspect-ratio: 1; border-radius: 50%; padding: 3px; border: 1.5px solid transparent; transition: border-color .2s, transform .15s; }
    .avatars button:hover { transform: translateY(-2px); }
    .avatars button[aria-checked="true"] { border-color: var(--ink); }
    .avatars img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; display: block; }
    .avatars span.name { position: absolute; left: 50%; top: 100%; translate: -50% 4px; font-size: 11px; white-space: nowrap; color: var(--ink-2); opacity: 0; transition: opacity .15s; pointer-events: none; }
    .avatars button:hover span.name, .avatars button[aria-checked="true"] span.name { opacity: 1; }
    .fields { display: grid; gap: 8px; margin-top: 22px; }
    .fields input, .fields textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .85);
      font: 400 15px var(--sans); color: var(--ink); outline: none; resize: none; user-select: text; transition: border-color .2s;
    }
    .fields input:focus, .fields textarea:focus { border-color: var(--ink); }
    .register-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .note { font-size: 13px; color: var(--ink-2); }
    .note.err { color: var(--danger); }
    .result-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }

    .toast { position: fixed; z-index: 9; left: 50%; top: 80px; translate: -50% 0; padding: 10px 18px; border-radius: 12px; background: rgba(21, 33, 27, .9); color: #fff; font-size: 14px; box-shadow: var(--shadow); }
    .noscript { position: fixed; inset: auto 0 40% 0; text-align: center; font-size: 18px; }

    /* ---------- smaller screens: the panel becomes a drawer ---------- */
    @media (max-width: 960px) {
      .side { transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none; z-index: 8; width: min(var(--side-w), calc(100% - 32px)); }
      body.side-open .side { transform: none; opacity: 1; pointer-events: auto; }
      .side-close { display: grid; place-items: center; }
      #side-open { display: grid; }
      body.playing #side-open { display: none; }
      .stagewrap { padding: 16px; }
    }
    @media (max-width: 560px) {
      .hero { padding: 28px 22px 22px; }
      .hud { gap: 10px; padding-left: 14px; height: 48px; }
      .hud-score { min-width: 56px; }
      .hud-score small { display: none; }
      .corner .icon { width: 40px; height: 40px; }
      body.playing .hud { left: 16px; translate: none; }
      .label { font-size: 15px; padding: 4px 9px 5px; }
      .sheet { padding: 22px 18px; }
      .big-score { font-size: 60px; }
      .stats b { font-size: 18px; }
      .avatars { grid-template-columns: repeat(4, 1fr); row-gap: 22px; }
      .register-foot { flex-direction: column; align-items: stretch; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  app.js: |
    import * as THREE from '/three.module.min.js';

    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    const now = () => performance.now();
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const easeOutBack = t => 1 + 2.4 * (t - 1) ** 3 + 1.4 * (t - 1) ** 2;
    const format = n => Number(n).toLocaleString('ko-KR');
    const levels = { easy: '쉬움', normal: '보통', hard: '어려움' };
    const NAMES = { chiikawa: '치이카와', hachiware: '하치와레', usagi: '우사기', rakko: '랏코', momonga: '모몽가', kurimanju: '쿠리만쥬', shisa: '시사', kani: '카니' };
    const storage = {
      get(k, f) { try { return JSON.parse(localStorage.getItem('typefall.' + k)) ?? f; } catch { return f; } },
      set(k, v) { try { localStorage.setItem('typefall.' + k, JSON.stringify(v)); } catch {} },
